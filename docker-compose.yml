services:
  ninfer:
    build:
      context: .
      args:
        SRC_DIR: ${SRC_DIR:-ninfer-src}
        CMAKE_EXTRA_ARGS: ${CMAKE_EXTRA_ARGS:-}
    image: ${IMAGE_TAG:-ninfer-qwen38-27b-nvfp4:latest}
    container_name: ${CONTAINER_NAME:-ninfer}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - MODEL_FILE=${MODEL_FILE:-/models/qwen3_8_27b_nvfp4.v3.ninfer}
      - PORT=8080
      - HOST=0.0.0.0
      - MAX_CONTEXT=${MAX_CONTEXT:-262144}
      - KV_CAPACITY=${KV_CAPACITY:-auto}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-4}
      - KV_DTYPE=${KV_DTYPE:-fp8}
      - EXTRA_ARGS=${EXTRA_ARGS:---device-state-slots 2 --host-state-slots 8 --host-kv-mib 8192 --spec mtp --draft-tokens 3 --lm-head-draft --preserve-thinking}
    volumes:
      - "${MODEL_DIR:-/home/perryh/git/ninfer/models}:/models:ro,Z"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
